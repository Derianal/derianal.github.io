<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <title>PKS Keuangan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PKS Keuangan">
  <style>
    :root{--bg:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
    #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;background:var(--bg);transition:opacity .3s}
    #load.hide{opacity:0;pointer-events:none}
    #load img{width:84px;height:84px}
    .spin{width:28px;height:28px;border:3px solid #334155;border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    #slow{display:none;max-width:360px;font-size:14px;color:var(--muted);line-height:1.5}
    #slow a{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:var(--accent);color:#0f172a;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <!-- Halaman pembungkus: aplikasi & data tetap di Google Apps Script (wajib login). Tidak ada data/kunci di sini. -->
  <div id="load" role="status" aria-live="polite">
    <img src="icon.svg" alt="">
    <b>PKS Keuangan</b>
    <div class="spin" aria-hidden="true"></div>
    <div id="slow">Aplikasi belum tampil.<br>Coba muat ulang, atau buka langsung:<br><a id="direct" href="#" target="_top" rel="noopener">Buka aplikasi langsung</a></div>
  </div>
  <iframe id="app" title="PKS Keuangan" allow="autoplay; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    const APP = 'https://script.google.com/macros/s/AKfycby6ZJQWMI1Xq12SNHwAV4kKXyXeXhhhedG_dZGe8jxe3qEZj_P8NeXQkPwfnLRZBzHm/exec';
    const frame = document.getElementById('app'), load = document.getElementById('load');
    document.getElementById('direct').href = APP;
    frame.src = APP;
    window.addEventListener('message', e => {
      if (e.data === 'pks-ready' && /\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) load.classList.add('hide');
    });
    setTimeout(() => { if (!load.classList.contains('hide')) document.getElementById('slow').style.display = 'block'; }, 15000);
  </script>
</body>
</html>
